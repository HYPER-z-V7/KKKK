
<div class="auth-box ng-card">
  <a class="brand center" href="/"><img src="/logo.gif" alt=""><span>RIHAN<b>X</b></span></a>
  <div class="tabs">
    <button class="tab active" data-mode="login">লগইন</button>
    <button class="tab" data-mode="signup">সাইনআপ</button>
  </div>
  <form id="auth-form" autocomplete="on">
    <label>ইউজারনেম<input id="username" autocomplete="username" required=""></label>
    <label>পাসওয়ার্ড<input id="password" type="password" autocomplete="current-password" required=""></label>
    <button class="btn btn-gold w-full" type="submit" id="submit-btn">লগইন</button>
  </form>
  <p class="muted center small" id="hint">অ্যাকাউন্ট নেই? উপরে সাইনআপ ট্যাব চাপো।</p>
</div>
