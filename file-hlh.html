
<header class="topbar">
  <a class="brand" href="/"><img src="/logo.gif" alt=""><span>RIHAN<b>X</b></span></a>
  <div class="hdr-right">
    <span class="pill">🔵 <b id="credits-basic">0</b></span>
    <span class="pill">⭐ <b id="credits-premium">0</b></span>
    <span class="pill" id="who">…</span>
    <button class="btn btn-ghost sm">লগআউট</button>
  </div>
</header>

<nav class="tabs tabs-bar">
  <button class="tab active" data-view="launch">লঞ্চ</button>
  <button class="tab" data-view="groups">আমার গ্রুপ</button>
  <button class="tab" data-view="coupons">কুপন</button>
  <button class="tab" data-view="wallet">ওয়ালেট</button>
  <button class="tab" data-view="inbox">ইনবক্স</button>
  <button class="tab" data-view="account">অ্যাকাউন্ট</button>
</nav>

<main class="page">
  <section id="view-launch" class="view">
    <div class="ng-card">
      <h2>নতুন গ্লোরি গ্রুপ</h2>
      <label>রিজিয়ন<select id="region-select"></select></label>
      <p class="small">খরচ: <span id="region-credit-cost">1 🔵 Basic credit</span> · মূল্য <span id="region-usd-price">$1.70</span></p>
      <label>ক্ল্যান আইডি<input id="clan-id" inputmode="numeric" placeholder="যেমন 3033431593"></label>
      <button class="btn btn-gold w-full" id="launch-btn">
        <span id="launch-btn-text">Start Group (1 Basic Credit)</span>
      </button>
    </div>
  </section>

  <section id="view-groups" class="view hidden">
    <div class="ng-card">
      <h2>আমার গ্রুপ <span class="badge" id="my-groups-count">0</span></h2>
      <div id="my-groups" class="skeleton-wrap"></div>
      <p id="my-groups-empty" class="muted small hidden">এখনো কোনো গ্রুপ নেই।</p>
    </div>
    <div class="ng-card">
      <h2>অ্যাক্টিভিটি</h2>
      <div id="activity" class="log"></div>
    </div>
  </section>

  <section id="view-coupons" class="view hidden">
    <div class="ng-card">
      <h2>কুপন রিডিম</h2>
      <div class="row">
        <input id="redeem-code" placeholder="RIHAN-X-XXXX-XXXX-XXXX">
        <button class="btn btn-gold">রিডিম</button>
      </div>
    </div>
    <div class="ng-card"><h2>তৈরি করা কুপন</h2><div id="coupons-mine"></div></div>
    <div class="ng-card"><h2>রিডিম করা</h2><div id="coupons-used"></div></div>
  </section>

  <section id="view-wallet" class="view hidden">
    <div class="ng-card">
      <h2>ক্রেডিট কিনুন</h2>
      <p class="small">পেমেন্ট আইডি: <code id="checkout-binance-id">—</code></p>
      <div class="row">
        <label>Basic<input id="buy-basic" type="number" min="0" value="1"></label>
        <label>Premium<input id="buy-premium" type="number" min="0" value="0"></label>
      </div>
      <label>অর্ডার / TxID<input id="buy-order" placeholder="পেমেন্টের পর TxID দাও"></label>
      <button class="btn btn-gold w-full">অর্ডার সাবমিট</button>
    </div>
    <div class="ng-card"><h2>ট্রানজেকশন</h2><div id="txs"></div></div>
  </section>

  <section id="view-inbox" class="view hidden">
    <div class="ng-card"><h2>ইনবক্স</h2><div id="inbox"></div></div>
  </section>

  <section id="view-account" class="view hidden">
    <div class="ng-card">
      <h2>পাসওয়ার্ড বদল</h2>
      <label>বর্তমান<input id="cur-pw" type="password"></label>
      <label>নতুন<input id="new-pw" type="password"></label>
      <button class="btn btn-gold w-full">আপডেট</button>
    </div>
  </section>
</main>

<div id="glory-modal" class="modal hidden"><div class="ng-card modal-box">
  <h2>গ্লোরি প্রগ্রেশন</h2><div id="glory-body" class="log"></div>
  <button class="btn btn-ghost w-full">বন্ধ</button>
</div></div>
<div id="message-modal" class="modal hidden"><div class="ng-card modal-box">
  <h2>মেসেজ</h2><p id="message-body"></p>
  <button class="btn btn-ghost w-full">বন্ধ</button>
</div></div>
<div id="rename-modal" class="modal hidden"><div class="ng-card modal-box">
  <h2>গ্রুপ রিনেম</h2><input id="rename-input">
  <button class="btn btn-gold w-full">ঠিক আছে</button>
</div></div>
